name = "sonora-api"
main = "src/index.ts"
compatibility_date = "2025-12-01"

[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"

# Create with: wrangler d1 create sonora-db
[[d1_databases]]
binding = "DB"
database_name = "sonora-db"
database_id = "daebf2c3-96a2-4490-b098-fcc41b45befa"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV_MEDIA"
id = "52a800fada5942a08e6c604f262d999d"

# Secrets (set with `wrangler secret put <NAME>`): JWT_SECRET,
# ADMIN_EMAIL, ADMIN_PASSWORD