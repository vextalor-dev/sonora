<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="0.5" stop-color="#0d0d18"/>
      <stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="eqbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <circle cx="230" cy="130" r="240" fill="url(#glow1)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="300" r="260" fill="url(#glow2)" filter="url(#soft)">
    <animate attributeName="opacity" values="1;0.65;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="60" r="180" fill="#312e81" opacity="0.22" filter="url(#soft2)">
    <animate attributeName="opacity" values="0.22;0.38;0.22" dur="11s" repeatCount="indefinite"/>
  </circle>

  <rect x="90" y="52" width="430" height="34" rx="17" fill="none" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="305" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4.5" fill="#c4b5fd" text-anchor="middle">SELF-HOSTED  ·  EDGE-DEPLOYED  ·  ANDROID-READY</text>

  <text x="88" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="url(#title)" letter-spacing="1">Sonora</text>
  <text x="92" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#94a3b8" letter-spacing="0.5">Your music. Your cloud. Zero servers to rent.</text>

  <g>
    <rect x="1005" y="255" width="14" height="52" rx="7" fill="url(#eqbar)">
      <animate attributeName="height" values="52;92;34;52" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="255;215;273;255" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1029" y="255" width="14" height="52" rx="7" fill="url(#eqbar)">
      <animate attributeName="height" values="52;38;84;52" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="255;269;223;255" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1053" y="255" width="14" height="52" rx="7" fill="url(#eqbar)">
      <animate attributeName="height" values="52;70;44;52" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="255;237;263;255" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1077" y="255" width="14" height="52" rx="7" fill="url(#eqbar)">
      <animate attributeName="height" values="52;96;30;52" dur="1.5s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="255;211;277;255" dur="1.5s" begin="0.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="1101" y="255" width="14" height="52" rx="7" fill="url(#eqbar)">
      <animate attributeName="height" values="52;48;88;52" dur="1.2s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="255;259;219;255" dur="1.2s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="1145" cy="265" r="30" fill="none" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="2">
    <animate attributeName="r" values="26;34;26" dur="3s" repeatCount="indefinite"/>
  </circle>
  <polygon points="1140,248 1140,282 1168,265" fill="#c084fc">
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </polygon>
</svg>
